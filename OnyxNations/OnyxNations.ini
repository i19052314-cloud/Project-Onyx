; ONYX RP: NATIONS & WAR — runtime settings.
; Sits next to the DLL in <GTA>\scripts\. Restart the game (or reload scripts)
; after editing. Keys are System.Windows.Forms.Keys names.

[General]
; Master switch. false = the module loads nothing and does nothing.
Enabled=true
; Write OnyxNations\onyx-nations.log
Logging=true
; Log level: 0=error 1=warn 2=info 3=debug
LogLevel=2

[Input]
; Open/close the presidential tablet (M1: the world-status screen).
; F6 is not used by Onyx RP (F7 emotes, F9 enable, F10 settings).
TabletKey=F6
; Dev tools (M1 verification): hand a region to a nation and force a save.
DevTools=true
DevGiveToRsa=NumPad1
DevGiveToFzsa=NumPad2
DevSaveNow=NumPad0

[Simulation]
; Milliseconds between world ticks. Everything heavy runs on its own interval
; inside the scheduler; this is only how often the scheduler is asked to run.
TickIntervalMs=100
; Warn in the log when any single scheduled job takes longer than this.
SlowJobMs=8

[Save]
; Seconds between autosaves (0 = off)
AutosaveSeconds=180
; Number of rotated backups kept next to world.json
Backups=5

[Debug]
; Draw the current-region overlay in the top-right corner.
Overlay=true
