; ONYX RP: NATIONS & WAR — runtime settings.
; Sits next to the DLL in <GTA>\scripts\. Restart the game (or reload scripts)
; after editing. Keys are System.Windows.Forms.Keys names.

[General]
; Master switch. false = the module loads nothing and does nothing.
Enabled=true
; Write OnyxNations\onyx-nations.log
Logging=true
; Log level: 0=error 1=warn 2=info 3=debug
LogLevel=2
; ru = Russian interface, anything else = English
Language=ru
; Which nation the player is the head of. This is the one nation the AI never
; drives — every decision about it is yours.
PlayerNation=rsa

; THIS FILE, AND ONLY THIS FILE. The module reads <GTA>\scripts\OnyxNations.ini.
; A copy in <GTA>\OnyxNations\ is ignored (older builds put one there by
; mistake); the installer now removes such a copy.

[Input]
; Open/close the presidential tablet.
; Free keys are rare: newer Onyx RP builds put their own tablet on M, F6 is
; taken by another menu on some setups, F5 is OnyxAdmin, F4 is the SHVDN
; console. Onyx itself holds F7 (emotes), F9 (ENABLE Onyx) and F10 (settings) -
; do not take those: a tablet on F9 would switch Onyx itself on and off.
; N, T, I, 0 and the number row belong to Onyx too. F8 is the default here.
; Key names are System.Windows.Forms.Keys names, case does not matter:
;   F1..F12              F8
;   letters              G, P, K
;   top-row digits       D1 .. D0
;   numpad               NumPad0 .. NumPad9
;   other                Insert, Home, End, PageUp, PageDown, Backspace
; A name the module does not recognise is reported in the log and F8 is used.
TabletKey=F8
; Modifiers for the tablet key. "Ctrl+Alt" turns F8 into Ctrl+Alt+F8, which no
; other mod is likely to want. Empty = no modifier. Accepts Ctrl, Alt, Shift.
; Handy trick: TabletKey=M with TabletModifiers=Ctrl+Alt leaves plain M to
; Onyx's tablet and opens the presidential one on Ctrl+Alt+M.
TabletModifiers=
; Inside the tablet: switch screens (Left/Right), pick a row (Up/Down), act
; (Enter). Shift+Enter is the second verb of the same row: dismiss a minister,
; lower a budget line, order the whole army, impose sanctions.
TabNextKey=Right
TabPrevKey=Left
CursorUpKey=Up
CursorDownKey=Down
ActionKey=Enter
; Dev tools: hand a region to a nation, save, declare war, sue for peace,
; order the nearest units into the region you are standing in, or drop money
; into your treasury while the game is running.
DevTools=true
DevGiveToRsa=NumPad1
DevGiveToFzsa=NumPad2
DevSaveNow=NumPad0
DevWarKey=NumPad7
DevPeaceKey=NumPad8
DevOrderKey=NumPad9
; Add money to YOUR treasury live, without touching the save file. The amount
; is set in [Debug] DevMoneyAmount; make it negative to take money away.
DevMoneyKey=NumPad3

[Army]
; Entity budget. GTA V cannot hold an army: only the squads nearest the player
; exist as real peds, everything else is numbers on the strategic map. Raising
; these costs frames; 2 squads / 12 soldiers is the tested setting.
MaxSquads=2
MaxSpawnedSoldiers=12
MaxSpawnedVehicles=4

[Borders]
; Same idea for the frontier: only the nearest crossings exist as props and
; guards. 2 posts / 8 guards is the tested setting.
MaxBorderPosts=2
MaxBorderGuards=8

[Simulation]
; Milliseconds between world ticks. Everything heavy runs on its own interval
; inside the scheduler; this is only how often the scheduler is asked to run.
TickIntervalMs=100
; Warn in the log when any single scheduled job takes longer than this.
SlowJobMs=8

[Save]
; Seconds between autosaves (0 = off)
AutosaveSeconds=180
; Number of rotated backups kept next to world.json
Backups=5

[Debug]
; Draw the current-region overlay in the top-right corner.
Overlay=true
; How much DevMoneyKey puts into (or, negative, takes out of) the treasury
; of PlayerNation. 1000000 = one million.
DevMoneyAmount=1000000
