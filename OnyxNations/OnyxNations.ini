; ONYX RP: NATIONS & WAR — runtime settings.
; Sits next to the DLL in <GTA>\scripts\. Restart the game (or reload scripts)
; after editing. Keys are System.Windows.Forms.Keys names.

[General]
; Master switch. false = the module loads nothing and does nothing.
Enabled=true
; Write OnyxNations\onyx-nations.log
Logging=true
; Log level: 0=error 1=warn 2=info 3=debug
LogLevel=2
; ru = Russian interface, anything else = English
Language=ru
; Which nation the player is the head of. This is the one nation the AI never
; drives — every decision about it is yours.
PlayerNation=rsa

[Input]
; Open/close the presidential tablet.
; F6 is not used by Onyx RP (F7 emotes, F9 enable, F10 settings).
; Newer Onyx RP builds put Onyx's own tablet on M. That tablet is a closed
; binary, so our screens cannot be drawn inside it. If you want ONE key, move
; Onyx's tablet in <GTA>\ProjectOnyx\Settings.xml and set TabletKey=M here.
TabletKey=F6
; Inside the tablet: switch screens (Left/Right), pick a row (Up/Down), act
; (Enter). Shift+Enter is the second verb of the same row: dismiss a minister,
; lower a budget line, order the whole army, impose sanctions.
TabNextKey=Right
TabPrevKey=Left
CursorUpKey=Up
CursorDownKey=Down
ActionKey=Enter
; Dev tools: hand a region to a nation, save, declare war, sue for peace,
; order the nearest units into the region you are standing in.
DevTools=true
DevGiveToRsa=NumPad1
DevGiveToFzsa=NumPad2
DevSaveNow=NumPad0
DevWarKey=NumPad7
DevPeaceKey=NumPad8
DevOrderKey=NumPad9

[Army]
; Entity budget. GTA V cannot hold an army: only the squads nearest the player
; exist as real peds, everything else is numbers on the strategic map. Raising
; these costs frames; 2 squads / 12 soldiers is the tested setting.
MaxSquads=2
MaxSpawnedSoldiers=12
MaxSpawnedVehicles=4

[Borders]
; Same idea for the frontier: only the nearest crossings exist as props and
; guards. 2 posts / 8 guards is the tested setting.
MaxBorderPosts=2
MaxBorderGuards=8

[Simulation]
; Milliseconds between world ticks. Everything heavy runs on its own interval
; inside the scheduler; this is only how often the scheduler is asked to run.
TickIntervalMs=100
; Warn in the log when any single scheduled job takes longer than this.
SlowJobMs=8

[Save]
; Seconds between autosaves (0 = off)
AutosaveSeconds=180
; Number of rotated backups kept next to world.json
Backups=5

[Debug]
; Draw the current-region overlay in the top-right corner.
Overlay=true
