<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 800" width="1920" height="800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="hb" cx="68%" cy="42%" r="70%"><stop offset="0" stop-color="#5a2bd6"/><stop offset=".45" stop-color="#1b1a66"/><stop offset="1" stop-color="#070b24"/></radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fd8" stop-opacity=".0"/><stop offset="1" stop-color="#7a5cff" stop-opacity=".55"/></linearGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
    <linearGradient id="bt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ff3ff"/><stop offset="1" stop-color="#1c8bd8"/></linearGradient>
    <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ae8"/><stop offset="1" stop-color="#a02ad6"/></linearGradient>
    <linearGradient id="by" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe76b"/><stop offset="1" stop-color="#ff9a1f"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8dff9a"/><stop offset="1" stop-color="#1fb86a"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <g id="blk"><rect x="0" y="0" width="100" height="100" rx="16" /><rect x="6" y="6" width="88" height="88" rx="12" fill="url(#gloss)"/><rect x="0" y="0" width="100" height="100" rx="16" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/></g>
  </defs>
  <rect width="1920" height="800" fill="url(#hb)"/>
  <!-- glow clouds -->
  <ellipse cx="1300" cy="330" rx="520" ry="260" fill="#8f4bff" opacity=".42" filter="url(#blur30)"/>
  <ellipse cx="1560" cy="520" rx="420" ry="190" fill="#18d9ff" opacity=".28" filter="url(#blur30)"/>
  <!-- perspective grid floor -->
  <g opacity=".75" stroke="#9d7bff" stroke-width="2" fill="none">
    <path d="M 900 800 L 1250 470 M 1100 800 L 1330 470 M 1300 800 L 1410 470 M 1500 800 L 1490 470 M 1700 800 L 1570 470 M 1900 800 L 1650 470 M 2100 800 L 1730 470 M 700 800 L 1170 470"/>
    <path d="M 700 800 H 2100 M 760 735 H 2000 M 830 678 H 1950 M 900 630 H 1900 M 960 590 H 1860 M 1010 558 H 1820 M 1050 530 H 1790 M 1090 508 H 1760 M 1120 490 H 1740"/>
  </g>
  <rect x="700" y="470" width="1400" height="330" fill="url(#floor)" opacity=".7"/>
  <!-- falling pieces -->
  <g transform="translate(1030 160) rotate(-10) scale(.8)" filter="url(#blur8)" opacity=".5">
    <use href="#blk" x="0" y="0" fill="url(#bt)"/><use href="#blk" x="100" y="0" fill="url(#bt)"/><use href="#blk" x="200" y="0" fill="url(#bt)"/><use href="#blk" x="300" y="0" fill="url(#bt)"/>
  </g>
  <g transform="translate(1020 150) rotate(-10) scale(.8)">
    <use href="#blk" x="0" y="0" fill="url(#bt)"/><use href="#blk" x="100" y="0" fill="url(#bt)"/><use href="#blk" x="200" y="0" fill="url(#bt)"/><use href="#blk" x="300" y="0" fill="url(#bt)"/>
  </g>
  <g transform="translate(1560 130) rotate(14) scale(.9)">
    <use href="#blk" x="100" y="0" fill="url(#bm)"/><use href="#blk" x="0" y="100" fill="url(#bm)"/><use href="#blk" x="100" y="100" fill="url(#bm)"/><use href="#blk" x="200" y="100" fill="url(#bm)"/>
  </g>
  <g transform="translate(1010 360) rotate(-8) scale(.95)">
    <use href="#blk" x="0" y="0" fill="url(#by)"/><use href="#blk" x="100" y="0" fill="url(#by)"/><use href="#blk" x="0" y="100" fill="url(#by)"/><use href="#blk" x="100" y="100" fill="url(#by)"/>
  </g>
  <g transform="translate(1640 660) rotate(-14) scale(.6)">
    <use href="#blk" x="0" y="0" fill="url(#bg)"/><use href="#blk" x="0" y="100" fill="url(#bg)"/><use href="#blk" x="100" y="100" fill="url(#bg)"/><use href="#blk" x="200" y="100" fill="url(#bg)"/>
  </g>
  <!-- stacked pieces on the floor -->
  <g transform="translate(1150 690) scale(.5)">
    <use href="#blk" x="0" y="0" fill="url(#bm)"/><use href="#blk" x="100" y="0" fill="url(#bt)"/><use href="#blk" x="200" y="0" fill="url(#by)"/><use href="#blk" x="300" y="0" fill="url(#bg)"/>
    <use href="#blk" x="100" y="-100" fill="url(#by)"/><use href="#blk" x="200" y="-100" fill="url(#bm)"/>
  </g>
  <!-- sparks -->
  <g fill="#fff" opacity=".85"><circle cx="1180" cy="210" r="3"/><circle cx="1420" cy="170" r="2.5"/><circle cx="1780" cy="300" r="3.5"/><circle cx="1640" cy="120" r="2"/><circle cx="1320" cy="440" r="2.5"/><circle cx="1880" cy="520" r="3"/></g>
</svg>