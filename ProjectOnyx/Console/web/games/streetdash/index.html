<html lang="en"><head><meta charset="utf-8"><title>Street Dash</title>
<link rel="stylesheet" href="/games/common/common.css">
<style>
  #stage { background: #2c0f4a; }
  canvas { position:absolute; left:0; top:0; }
  .hud { position:absolute; top: 34px; display:flex; gap: 22px; z-index: 3; }
  .hud .s { min-width: 250px; border-radius: 18px; padding: 14px 26px; background: linear-gradient(180deg, rgba(40,14,60,.62), rgba(20,6,34,.7)); border: 1.5px solid rgba(255,180,200,.25); backdrop-filter: blur(8px); }
  .hud h4 { font-size: 16px; letter-spacing: 4px; color: #ffb3c9; text-transform: uppercase; font-weight: 600; }
  .hud .v { font-family: 'Bahnschrift','Segoe UI'; font-size: 52px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
</style></head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="hud" style="left:96px"><div class="s"><h4>Distance</h4><div class="v"><span id="dist">0</span> m</div></div><div class="s"><h4>Coins</h4><div class="v" id="coins">0</div></div></div>
  <div class="hud" style="right:96px"><div class="s"><h4>Best</h4><div class="v"><span id="best">0</span> m</div></div></div>
  <div class="bar"><div><span><span class="key">Space</span>Jump (twice for a double jump)</span><span><span class="key">&darr;</span>Duck</span></div><div><span style="margin:0"><span class="key">Esc</span>Menu</span></div></div>
  <div class="vig"></div>
  <div class="ov" id="ov"><div class="box"></div></div>
</div>
<script src="/bridge.js"></script><script src="/games/common/common.js"></script>
<script>
(function () {
  var W = 1920, H = 1080, GY = 860, RX = 420, c = document.getElementById('c').getContext('2d'), $ = function (i) { return document.getElementById(i); };
  var state = 'title', paused = false, last = 0, keys = {}, speed, dist, coins, runner, obs, pickups, nextSpawn, t = 0, shake = 0, particles = [], bestSaved = 0, pendingCoins = 0, jumpsLeft;
  var layers = [mkLayer(0.12, 340, 520, '#4a1560', 70), mkLayer(0.25, 260, 440, '#37104d', 90), mkLayer(0.45, 200, 380, '#220a38', 110)];

  function mkLayer(par, hmin, hmax, col, wavg) { var b = [], x = 0; while (x < 4200) { var w = wavg * (0.7 + Math.random() * 0.9), h = hmin + Math.random() * (hmax - hmin) * 0.6; b.push({ x: x, w: w, h: h, wins: Math.random() }); x += w + 6; } return { par: par, b: b, col: col, span: x }; }
  function reset() {
    speed = 640; dist = 0; coins = 0; pendingCoins = 0; obs = []; pickups = []; particles = []; nextSpawn = 900; t = 0; jumpsLeft = 2;
    runner = { y: GY, vy: 0, duck: false, dead: false, ph: 0, tumble: 0 }; ui();
  }
  function ui() { $('dist').textContent = Game.fmt(dist / 40); $('coins').textContent = coins; $('best').textContent = Game.fmt(Math.max(bestSaved, Math.floor(dist / 40))); }
  function jump() {
    if (runner.dead) return; if (runner.y >= GY - 1) { runner.vy = -1560; jumpsLeft = 1; Sfx.tone(520, .12, 'square', .12, 1.6); dust(8); }
    else if (jumpsLeft > 0) { runner.vy = -1280; jumpsLeft--; Sfx.tone(700, .12, 'square', .12, 1.5); dust(6); }
  }
  function dust(n) { for (var i = 0; i < n; i++) particles.push({ x: RX - 10, y: GY, vx: -160 - Math.random() * 260, vy: -Math.random() * 180, t: .5, c: 'rgba(255,220,200,.7)', r: 4 + Math.random() * 5 }); }
  function spawn() {
    var kind = Math.random(), x = W + 100;
    if (dist < 2400 && kind > .7) kind = .5;
    if (kind < .38) obs.push({ x: x, w: 96, h: 96, type: 'crate' });
    else if (kind < .55) obs.push({ x: x, w: 96, h: 96, type: 'crate' }, { x: x, w: 96, h: 96, type: 'crate', y2: 96 });
    else if (kind < .75) obs.push({ x: x, w: 230, h: 104, type: 'dumpster' });
    else if (kind < .93) obs.push({ x: x, w: 150, h: 18, type: 'bar', lift: 112 });
    else { obs.push({ x: x, w: 96, h: 96, type: 'crate' }, { x: x + 330, w: 150, h: 18, type: 'bar', lift: 112 }); }
    // coins
    var n = 3 + Math.floor(Math.random() * 5), base = GY - (Math.random() < .5 ? 70 : 250);
    for (var i = 0; i < n; i++) pickups.push({ x: x - 160 + i * 64, y: base - Math.sin(i / (n - 1) * 3.14) * 60, got: false });
    nextSpawn = speed * (0.75 + Math.random() * 0.55) + 460;
  }
  function hitbox() { var h = runner.duck && runner.y >= GY - 1 ? 74 : 148; return { x: RX - 26, y: runner.y - h, w: 52, h: h }; }
  function update(dt) {
    t += dt; speed = Math.min(1550, 640 + dist / 40 * 0.17); dist += speed * dt;
    runner.duck = !!(keys.ArrowDown || keys.KeyS); runner.ph += dt * (7 + speed / 150);
    runner.vy += 4600 * dt; runner.y += runner.vy * dt; if (runner.y >= GY) { if (runner.vy > 600) { dust(5); Sfx.tone(140, .05, 'triangle', .12); } runner.y = GY; runner.vy = 0; jumpsLeft = 2; }
    if (runner.duck && runner.y < GY - 1) runner.vy += 3200 * dt;
    nextSpawn -= speed * dt; if (nextSpawn <= 0) spawn();
    obs.forEach(function (o) { o.x -= speed * dt; }); pickups.forEach(function (p) { p.x -= speed * dt; });
    obs = obs.filter(function (o) { return o.x + o.w > -60; }); pickups = pickups.filter(function (p) { return p.x > -60 && !p.got; });
    var hb = hitbox();
    pickups.forEach(function (p) { if (!p.got && p.x > hb.x - 24 && p.x < hb.x + hb.w + 24 && p.y > hb.y - 24 && p.y < hb.y + hb.h + 24) { p.got = true; coins++; pendingCoins++; Sfx.coin(); for (var i = 0; i < 6; i++) particles.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 400, vy: (Math.random() - .5) * 400, t: .4, c: '#ffd36b', r: 4 }); } });
    obs.forEach(function (o) {
      var oy = o.type === 'bar' ? GY - o.lift - o.h : GY - o.h - (o.y2 || 0), ob = { x: o.x + 6, y: oy + 4, w: o.w - 12, h: (o.type === 'bar' ? o.h : o.h) - 4 };
      if (hb.x < ob.x + ob.w && hb.x + hb.w > ob.x && hb.y < ob.y + ob.h && hb.y + hb.h > ob.y) die();
    });
    if (pendingCoins >= 10) { GameStation.stat('coins', pendingCoins); pendingCoins = 0; }
    particles.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt; p.t -= dt; }); particles = particles.filter(function (p) { return p.t > 0; });
    ui();
  }
  function die() {
    if (runner.dead) return; runner.dead = true; state = 'dying'; shake = 18; Sfx.over(); var m = Math.floor(dist / 40), wasBest = m > bestSaved; if (wasBest) bestSaved = m;
    if (pendingCoins) { GameStation.stat('coins', pendingCoins); pendingCoins = 0; } GameStation.score(m);
    setTimeout(function () { state = 'over'; Game.overlay('ov', '<h1>Busted</h1>' + (wasBest && m > 0 ? '<div class="new">NEW BEST</div>' : '') + '<div class="stat"><div>Distance<b>' + Game.fmt(m) + ' m</b></div><div>Coins<b>' + coins + '</b></div></div><div class="go">Run again <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true); }, 900);
  }

  /* ---------- drawing ---------- */
  function sky() { var g = c.createLinearGradient(0, 0, 0, GY); g.addColorStop(0, '#ff8a45'); g.addColorStop(.45, '#d63a6a'); g.addColorStop(1, '#4a1560'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
  function sun() { var g = c.createRadialGradient(1380, 470, 40, 1380, 470, 380); g.addColorStop(0, 'rgba(255,230,160,.9)'); g.addColorStop(.35, 'rgba(255,170,110,.35)'); g.addColorStop(1, 'rgba(255,120,120,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); c.fillStyle = '#ffd9a0'; c.beginPath(); c.arc(1380, 470, 170, 0, 6.3); c.fill(); }
  function layer(L, scroll) {
    var off = (scroll * L.par) % L.span; c.fillStyle = L.col;
    for (var k = -1; k < 2; k++) L.b.forEach(function (b) { var x = b.x - off + k * L.span; if (x > W + 50 || x + b.w < -50) return; c.fillRect(x, GY - b.h, b.w, b.h + 4);
      if (L.par > .2) { c.fillStyle = 'rgba(255,205,120,.55)'; for (var wy = GY - b.h + 24; wy < GY - 30; wy += 38) for (var wx = x + 14; wx < x + b.w - 20; wx += 26) if (((wx * 7 + wy * 3) | 0) % 5 === Math.floor(b.wins * 5)) c.fillRect(wx, wy, 8, 12); c.fillStyle = L.col; } });
  }
  function ground(scroll) {
    c.fillStyle = '#18072c'; c.fillRect(0, GY, W, H - GY); c.fillStyle = '#2a0f45'; c.fillRect(0, GY, W, 14);
    c.strokeStyle = 'rgba(255,170,200,.5)'; c.lineWidth = 6; c.setLineDash([80, 70]); c.lineDashOffset = scroll % 150; c.beginPath(); c.moveTo(0, GY + 90); c.lineTo(W, GY + 90); c.stroke(); c.setLineDash([]);
    var px = 1000 - (scroll * 0.9) % 700; for (var k = 0; k < 4; k++) { var x = px + k * 700; c.fillStyle = '#10051f'; c.fillRect(x, GY - 330, 12, 330); c.fillRect(x - 50, GY - 336, 70, 10); c.fillStyle = 'rgba(255,215,140,.9)'; c.fillRect(x - 56, GY - 330, 24, 10); var gg = c.createRadialGradient(x - 44, GY - 322, 4, x - 44, GY - 322, 150); gg.addColorStop(0, 'rgba(255,215,140,.35)'); gg.addColorStop(1, 'rgba(255,215,140,0)'); c.fillStyle = gg; c.fillRect(x - 200, GY - 470, 320, 320); }
  }
  function drawObs(o) {
    if (o.type === 'bar') { var y = GY - o.lift - o.h; c.fillStyle = '#10051f'; c.fillRect(o.x + 8, y, 12, o.lift + o.h); c.fillRect(o.x + o.w - 20, y, 12, o.lift + o.h); var g = c.createLinearGradient(0, y, 0, y + o.h); g.addColorStop(0, '#ff6b7a'); g.addColorStop(1, '#b0203a'); c.fillStyle = g; c.fillRect(o.x, y - 14, o.w, o.h + 14); c.fillStyle = 'rgba(255,255,255,.85)'; for (var i = 0; i < 5; i++) c.fillRect(o.x + 8 + i * 30, y - 14, 14, o.h + 14); return; }
    var y = GY - o.h - (o.y2 || 0), g2 = c.createLinearGradient(o.x, y, o.x, y + o.h);
    if (o.type === 'crate') { g2.addColorStop(0, '#d98a4a'); g2.addColorStop(1, '#8a4a1f'); c.fillStyle = g2; c.fillRect(o.x, y, o.w, o.h); c.strokeStyle = '#4a2208'; c.lineWidth = 6; c.strokeRect(o.x + 3, y + 3, o.w - 6, o.h - 6); c.beginPath(); c.moveTo(o.x + 4, y + 4); c.lineTo(o.x + o.w - 4, y + o.h - 4); c.moveTo(o.x + o.w - 4, y + 4); c.lineTo(o.x + 4, y + o.h - 4); c.stroke(); }
    else { g2.addColorStop(0, '#3f9a5a'); g2.addColorStop(1, '#1d5a35'); c.fillStyle = g2; c.fillRect(o.x, y, o.w, o.h); c.fillStyle = '#143f26'; c.fillRect(o.x - 6, y - 12, o.w + 12, 14); c.fillStyle = 'rgba(255,255,255,.18)'; for (var i = 1; i < 5; i++) c.fillRect(o.x + i * 40, y + 8, 4, o.h - 16); }
  }
  function drawRunner() {
    var x = RX, y = runner.y, ph = runner.ph, air = y < GY - 1, duck = runner.duck && !air, dead = runner.dead;
    c.save(); c.translate(x, y); if (dead) { runner.tumble += 0.2; c.rotate(runner.tumble); c.translate(0, -60); }
    c.lineCap = 'round'; c.lineJoin = 'round';
    var sw = air ? 0.8 : Math.sin(ph), sw2 = air ? -0.6 : -Math.sin(ph), hipY = duck ? -44 : -80, shY = duck ? -80 : -128, lean = duck ? 18 : 6;
    c.shadowColor = 'rgba(255,170,90,.7)'; c.shadowBlur = 18;
    function limb(x0, y0, a, l1, l2, col, w) { var kx = x0 + Math.sin(a) * l1, ky = y0 + Math.cos(a) * l1, ex = kx + Math.sin(a * 0.4 + .5) * l2 * (duck ? .6 : 1), ey = ky + Math.cos(a * 0.4 + .5) * l2; c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(kx, ky); c.lineTo(ex, ey); c.stroke(); }
    limb(-4, hipY, sw2 * 0.9, 36, 36, '#1a1030', 17); limb(-6, shY + 10, sw * 1.0 - .2, 30, 28, '#e8e8f0', 13);
    c.strokeStyle = '#f4f4fa'; c.lineWidth = 38; c.beginPath(); c.moveTo(-4, hipY); c.lineTo(lean, shY); c.stroke();
    c.strokeStyle = '#d63a6a'; c.lineWidth = 10; c.beginPath(); c.moveTo(-14, hipY - 6); c.lineTo(lean - 10, shY + 6); c.stroke();
    limb(4, hipY, sw * 0.9, 36, 36, '#2a2048', 17); limb(4, shY + 10, sw2 * 1.0 - .2, 30, 28, '#ffffff', 13);
    c.fillStyle = '#ffd9b8'; c.beginPath(); c.arc(lean + 6, shY - 28, 21, 0, 6.3); c.fill(); c.fillStyle = '#f4f4fa'; c.beginPath(); c.arc(lean + 2, shY - 32, 22, 3.3, 6.2); c.fill();
    c.restore();
  }
  function draw() {
    var scroll = dist; c.save(); if (shake > 0) c.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); sky(); sun(); layers.forEach(function (L) { layer(L, scroll); }); ground(scroll);
    if (obs) { pickups.forEach(function (p) { c.save(); c.shadowColor = '#ffd36b'; c.shadowBlur = 16; var g = c.createRadialGradient(p.x - 4, p.y - 4, 2, p.x, p.y, 17); g.addColorStop(0, '#fff6c8'); g.addColorStop(1, '#f0a81e'); c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, 17, 0, 6.3); c.fill(); c.strokeStyle = '#8a5a08'; c.lineWidth = 3; c.stroke(); c.restore(); }); obs.forEach(drawObs); }
    if (runner) drawRunner();
    particles.forEach(function (p) { c.globalAlpha = Math.max(0, p.t * 1.6); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.3); c.fill(); }); c.globalAlpha = 1;
    if (speed > 1000) { c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 3; for (var i = 0; i < 14; i++) { var yy = (i * 163 + t * 900) % 760 + 60, xx = (i * 311 - t * speed * 1.2) % 2100; c.beginPath(); c.moveTo(xx, yy); c.lineTo(xx + 140, yy); c.stroke(); } }
    c.restore();
  }
  function press(code) {
    if (state === 'title' || state === 'over') { if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { Sfx.unlock(); Game.overlay('ov', null, false); reset(); state = 'play'; } return; }
    if (state !== 'play' || paused) return; if (code === 'Space' || code === 'ArrowUp' || code === 'KeyW') jump();
  }
  addEventListener('keydown', function (e) { keys[e.code] = true; if (!e.repeat) press(e.code); if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault(); });
  addEventListener('keyup', function (e) { keys[e.code] = false; });
  GameStation.onPause(function () { paused = true; }); GameStation.onResume(function () { paused = false; last = 0; });
  function frame(now) {
    var dt = last ? Math.min(0.033, Math.max(0, (now - last) / 1000)) : 0; last = now;
    if (state === 'play' && !paused && !window.__sim) update(dt); if (state === 'dying') { runner.vy += 3000 * dt; runner.y = Math.min(GY, runner.y + runner.vy * dt); particles.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); }
    if (shake > 0) shake -= dt * 40; draw(); requestAnimationFrame(frame);
  }
  reset(); state = 'title'; speed = 700;
  GameStation.load().then(function (s) { var g = (s.games || {}).streetdash || {}; bestSaved = g.best || 0; ui(); });
  Game.overlay('ov', '<h1>Street Dash</h1><p>Run, jump the crates, duck the bars, grab the coins.<br>Jump twice in the air for a double jump.</p><div class="go">Run <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true);
  requestAnimationFrame(frame);
  window.__dbg = function () { return JSON.stringify({ state: state, dist: dist, speed: speed, coins: coins, ry: runner && runner.y, obs: obs && obs.length }); };
  if (location.hash === '#demo') setTimeout(function () { window.__sim = true; press('Enter'); setInterval(function () { if (state !== 'play') return; for (var i = 0; i < 4; i++) { update(0.016); var hb = hitbox(); obs.forEach(function (o) { var d = o.x - (hb.x + hb.w); if (d > 0 && d < speed * 0.34 && runner.y >= GY - 1) { if (o.type === 'bar') { keys.ArrowDown = true; setTimeout(function () { keys.ArrowDown = false; }, 450); } else jump(); } }); } }, 10); }, 200);
})();
</script></body></html>
