<html lang="en"><head><meta charset="utf-8"><title>Skate</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI Variable Display','Segoe UI',Arial,sans-serif; color:#fff }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000 }
  #note { position:absolute; left:50%; bottom:22px; transform:translateX(-50%); padding:10px 22px; border-radius:22px; background:rgba(8,12,30,.78); border:1px solid rgba(255,255,255,.2); font-size:15px; opacity:0; transition:opacity .4s; pointer-events:none }
  #leave { position:absolute; left:50%; top:0; transform:translate(-50%,-100%); padding:9px 22px 10px; border-radius:0 0 18px 18px; background:rgba(8,12,30,.92); border:1px solid rgba(255,255,255,.25); border-top:0; font-size:16px; font-weight:600; cursor:pointer; transition:transform .2s; z-index:5 }
  #hot { position:absolute; left:30%; right:30%; top:0; height:10px; z-index:4 }
  #hot:hover + #leave, #leave:hover { transform:translate(-50%,0) }
  #off { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; background:#050913; font-size:22px; line-height:1.6; color:#b7c4e6 }
</style></head>
<body>
<iframe id="g" allow="autoplay; fullscreen; gamepad; keyboard-map; clipboard-write; pointer-lock" allowfullscreen></iframe>
<div id="hot"></div><div id="leave">Back to the console</div>
<div id="note">Skate needs the internet. Press F9 to go back to the console (Ctrl+Alt+F9 closes it).</div>
<div id="off"><div><b style="font-size:34px;color:#fff">No connection</b><br>Skate loads from the internet.<br>Check your connection, then open the game again.<br><br><span id="back" style="display:inline-block;padding:10px 26px;border-radius:24px;background:#fff;color:#0a1228;font-weight:700;cursor:pointer">Back to the console</span></div></div>
<script src="/bridge.js"></script>
<script>
(function () {
  var URL = 'https://skate.aaddpp.lol/';
  var f = document.getElementById('g'), note = document.getElementById('note');
  function leave() { GameStation.quit(); }
  document.getElementById('leave').onclick = leave; document.getElementById('back').onclick = leave;
  function start() {
    f.src = URL; note.style.opacity = 1; setTimeout(function () { note.style.opacity = 0; }, 6000);
    setTimeout(function () { try { f.focus(); } catch (e) {} }, 1500);
  }
  if (navigator.onLine === false) document.getElementById('off').style.display = 'flex'; else start();
  window.addEventListener('online', function () { document.getElementById('off').style.display = 'none'; start(); });
})();
</script>
</body></html>
