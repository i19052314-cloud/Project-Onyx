<html lang="en"><head><meta charset="utf-8"><title>Serpent</title>
<link rel="stylesheet" href="/games/common/common.css">
<style>
  #stage { background: radial-gradient(ellipse at 50% 40%, #0f6b4a 0%, #07301f 45%, #020a07 85%); }
  .top { position:absolute; left: 288px; top: 38px; width: 1344px; display:flex; gap: 24px; }
  .stat { flex: 1; border-radius: 18px; padding: 16px 26px; background: linear-gradient(180deg, rgba(10,50,36,.72), rgba(4,24,16,.78)); border: 1.5px solid rgba(120,255,190,.22); backdrop-filter: blur(8px); }
  .stat h4 { font-size: 16px; letter-spacing: 4px; color: #7fd4ad; text-transform: uppercase; font-weight: 600; }
  .stat .v { font-family: 'Bahnschrift','Segoe UI'; font-size: 52px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .arena { position:absolute; left: 288px; top: 176px; width: 1344px; height: 816px; border-radius: 18px; overflow: hidden; border: 2px solid rgba(120,255,190,.4); box-shadow: 0 0 0 6px rgba(60,200,140,.10), 0 0 90px rgba(40,220,140,.35), inset 0 0 60px rgba(0,0,0,.5); background: #03140d; }
  canvas { display:block; }
  .bonusbar { position:absolute; left: 288px; top: 160px; height: 8px; width: 0; border-radius: 4px; background: #ffd36b; box-shadow: 0 0 14px #ffd36b; transition: width .1s linear; }
</style></head>
<body>
<div id="stage">
  <div class="top">
    <div class="stat"><h4>Score</h4><div class="v" id="score">0</div></div>
    <div class="stat"><h4>Best</h4><div class="v" id="best">0</div></div>
    <div class="stat"><h4>Length</h4><div class="v" id="len">3</div></div>
    <div class="stat"><h4>Apples</h4><div class="v" id="apples">0</div></div>
  </div>
  <div class="bonusbar" id="bonusbar"></div>
  <div class="arena"><canvas id="c" width="1344" height="816"></canvas></div>
  <div class="bar"><div><span><span class="key">&larr; &uarr; &darr; &rarr;</span>Steer</span><span><span class="key">W A S D</span>Steer</span><span><span class="key">Space</span>Boost</span></div><div><span style="margin:0"><span class="key">Esc</span>Menu</span></div></div>
  <div class="vig"></div>
  <div class="ov" id="ov"><div class="box"></div></div>
</div>
<script src="/bridge.js"></script><script src="/games/common/common.js"></script>
<script>
(function () {
  var CW = 48, COLS = 28, ROWS = 17, W = COLS * CW, H = ROWS * CW;
  var cv = document.getElementById('c'), c = cv.getContext('2d'), $ = function (i) { return document.getElementById(i); };
  var snake, prev, dir, queue, apple, bonus, score, apples, state = 'title', paused = false, acc = 0, step = 0.14, bestSaved = 0, last, boost = false, particles = [], over = 0, eatFlash = 0;

  function reset() {
    var cx = 8, cy = 8; snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }]; prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    dir = { x: 1, y: 0 }; queue = []; score = 0; apples = 0; bonus = null; acc = 0; step = 0.14; particles = []; placeApple(); ui();
  }
  function free(x, y) { return !snake.some(function (s) { return s.x === x && s.y === y; }); }
  function randCell() { var x, y, n = 0; do { x = Math.floor(Math.random() * COLS); y = Math.floor(Math.random() * ROWS); n++; } while (!free(x, y) && n < 400); return { x: x, y: y }; }
  function placeApple() { apple = randCell(); }
  function ui() { $('score').textContent = Game.fmt(score); $('best').textContent = Game.fmt(Math.max(bestSaved, score)); $('len').textContent = snake.length; $('apples').textContent = apples; }
  function turn(dx, dy) { var ref = queue.length ? queue[queue.length - 1] : dir; if ((ref.x === dx && ref.y === dy) || (ref.x === -dx && ref.y === -dy)) return; if (queue.length < 2) { queue.push({ x: dx, y: dy }); Sfx.blip(300); } }
  function stepSnake() {
    if (queue.length) dir = queue.shift();
    prev = snake.map(function (s) { return { x: s.x, y: s.y }; });
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS || snake.slice(0, snake.length - 1).some(function (s) { return s.x === h.x && s.y === h.y; })) return die();
    snake.unshift(h); prev.unshift({ x: h.x - dir.x, y: h.y - dir.y });
    var grew = false;
    if (h.x === apple.x && h.y === apple.y) {
      grew = true; apples++; score += 10; eatFlash = 1; Sfx.coin(); burst(apple.x, apple.y, '#ff6b6b'); GameStation.stat('apples', 1); placeApple();
      step = Math.max(0.065, step - 0.0018);
      if (apples % 5 === 0 && !bonus) bonus = { cell: randCell(), t: 7 };
      GameStation.score(0, { maxlen: snake.length });
    }
    if (bonus && h.x === bonus.cell.x && h.y === bonus.cell.y) { grew = true; score += 50; Sfx.win(); burst(h.x, h.y, '#ffd36b'); bonus = null; }
    if (!grew) { snake.pop(); prev.pop(); }
    ui();
  }
  function burst(x, y, col) { for (var i = 0; i < 18; i++) { var a = Math.random() * 6.28, s = 80 + Math.random() * 220; particles.push({ x: x * CW + CW / 2, y: y * CW + CW / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.6 + Math.random() * 0.4, c: col }); } }
  function die() {
    state = 'over'; over = 1; Sfx.over(); var wasBest = score > bestSaved; GameStation.score(score, { maxlen: snake.length });
    if (wasBest) bestSaved = score;
    Game.overlay('ov', '<h1>Game over</h1>' + (wasBest && score > 0 ? '<div class="new">NEW BEST</div>' : '') + '<div class="stat"><div>Score<b>' + Game.fmt(score) + '</b></div><div>Length<b>' + snake.length + '</b></div><div>Apples<b>' + apples + '</b></div></div><div class="go">Play again <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true);
    ui();
  }

  function draw(t) {
    c.clearRect(0, 0, W, H);
    c.strokeStyle = 'rgba(80,220,160,.09)'; c.lineWidth = 1; for (var i = 0; i <= COLS; i++) { c.beginPath(); c.moveTo(i * CW, 0); c.lineTo(i * CW, H); c.stroke(); } for (var j = 0; j <= ROWS; j++) { c.beginPath(); c.moveTo(0, j * CW); c.lineTo(W, j * CW); c.stroke(); }
    if (!snake) return;
    var pulse = 1 + Math.sin(performance.now() / 180) * 0.06;
    // apple
    drawApple(apple.x * CW + CW / 2, apple.y * CW + CW / 2, 17 * pulse, '#ff4d4d', '#ff9a9a');
    if (bonus) { drawApple(bonus.cell.x * CW + CW / 2, bonus.cell.y * CW + CW / 2, 20 * pulse, '#ffc43a', '#fff0b8', true); }
    // body: a thick line through the (smoothed) centres
    var pts = snake.map(function (s, i) { var p = prev[i] || s; return { x: (p.x + (s.x - p.x) * t) * CW + CW / 2, y: (p.y + (s.y - p.y) * t) * CW + CW / 2 }; });
    var hx = pts[0].x, hy = pts[0].y, tx = pts[pts.length - 1].x, ty = pts[pts.length - 1].y, g = c.createLinearGradient(hx, hy, tx, ty);
    g.addColorStop(0, '#c8ff6a'); g.addColorStop(1, '#1ec97c');
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
    c.shadowColor = 'rgba(100,255,160,.8)'; c.shadowBlur = 26; c.strokeStyle = g; c.lineWidth = 36; c.beginPath(); pts.forEach(function (p, i) { if (i) c.lineTo(p.x, p.y); else c.moveTo(p.x, p.y); }); c.stroke();
    c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 10; c.beginPath(); pts.forEach(function (p, i) { if (i) c.lineTo(p.x, p.y - 7); else c.moveTo(p.x, p.y - 7); }); c.stroke();
    c.restore();
    // head + eyes
    var d = dir, ex = -d.y, ey = d.x; c.fillStyle = '#e8ffd0'; c.beginPath(); c.arc(hx, hy, 19, 0, 6.3); c.fill();
    [-1, 1].forEach(function (sd) { var px = hx + d.x * 6 + ex * sd * 9, py = hy + d.y * 6 + ey * sd * 9; c.fillStyle = '#fff'; c.beginPath(); c.arc(px, py, 6.5, 0, 6.3); c.fill(); c.fillStyle = '#06210f'; c.beginPath(); c.arc(px + d.x * 2, py + d.y * 2, 3.4, 0, 6.3); c.fill(); });
    particles.forEach(function (p) { c.globalAlpha = Math.max(0, p.t); c.fillStyle = p.c; c.beginPath(); c.arc(p.x, p.y, 4, 0, 6.3); c.fill(); }); c.globalAlpha = 1;
    if (eatFlash > 0) { c.fillStyle = 'rgba(255,255,255,' + (eatFlash * .06) + ')'; c.fillRect(0, 0, W, H); }
  }
  function drawApple(x, y, r, col, hi, star) {
    c.save(); c.shadowColor = col; c.shadowBlur = 24; var g = c.createRadialGradient(x - r * .3, y - r * .35, 2, x, y, r); g.addColorStop(0, hi); g.addColorStop(1, col); c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 6.3); c.fill(); c.shadowBlur = 0;
    c.strokeStyle = star ? '#fff7d6' : '#7bff7b'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(x, y - r + 3); c.quadraticCurveTo(x + 3, y - r - 10, x + 14, y - r - 10); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(x - r * .35, y - r * .4, r * .22, r * .14, -0.6, 0, 6.3); c.fill(); c.restore();
  }

  function press(code) {
    if (state !== 'play') { if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { Sfx.unlock(); Game.overlay('ov', null, false); reset(); state = 'play'; } return; }
    if (paused) return;
    switch (code) { case 'ArrowUp': case 'KeyW': turn(0, -1); break; case 'ArrowDown': case 'KeyS': turn(0, 1); break; case 'ArrowLeft': case 'KeyA': turn(-1, 0); break; case 'ArrowRight': case 'KeyD': turn(1, 0); break; case 'Space': boost = true; break; }
  }
  addEventListener('keydown', function (e) { if (e.repeat) { e.preventDefault(); return; } press(e.code); if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault(); });
  addEventListener('keyup', function (e) { if (e.code === 'Space') boost = false; });
  GameStation.onPause(function () { paused = true; }); GameStation.onResume(function () { paused = false; last = 0; });

  function frame(now) {
    var dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0; last = now;
    if (state === 'play' && !paused) {
      acc += dt * (boost ? 1.8 : 1); if (acc >= step) { acc -= step; stepSnake(); }
      if (bonus) { bonus.t -= dt; if (bonus.t <= 0) bonus = null; }
      $('bonusbar').style.width = bonus ? Math.round(1344 * bonus.t / 7) + 'px' : '0';
    }
    particles.forEach(function (p) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; }); particles = particles.filter(function (p) { return p.t > 0; }); if (eatFlash > 0) eatFlash -= dt * 4;
    draw(state === 'play' ? Math.min(1, acc / step) : 1);
    requestAnimationFrame(frame);
  }
  last = 0;
  GameStation.load().then(function (s) { var g = (s.games || {}).serpent || {}; bestSaved = g.best || 0; $('best').textContent = Game.fmt(bestSaved); });
  Game.overlay('ov', '<h1>Serpent</h1><p>Eat the apples, do not hit the wall or yourself.<br>A golden apple shows up every 5 apples: grab it fast.</p><div class="go">Start <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true);
  requestAnimationFrame(frame);
  if (location.hash === '#demo') setTimeout(function () { press('Enter'); var n = 0; setInterval(function () { n++; var o = [[1, 0], [0, 1], [-1, 0], [0, -1]]; if (n % 3 === 0) { var k = o[Math.floor(Math.random() * 4)]; turn(k[0], k[1]); } if (n > 40) { } }, 160); }, 200);
})();
</script></body></html>
