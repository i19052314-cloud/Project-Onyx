<html lang="en"><head><meta charset="utf-8"><title>Block Drop</title>
<link rel="stylesheet" href="/games/common/common.css">
<style>
  #stage { background: radial-gradient(ellipse at 50% 40%, #2a1a78 0%, #120f46 38%, #070a22 75%); }
  .glowA { position:absolute; left: 180px; top: 260px; width: 720px; height: 720px; border-radius: 50%; background: #18d9ff; opacity: .16; filter: blur(120px); }
  .glowB { position:absolute; right: 120px; top: 120px; width: 760px; height: 760px; border-radius: 50%; background: #ff4fd8; opacity: .18; filter: blur(130px); }
  .well { position: absolute; left: 720px; top: 62px; width: 480px; height: 944px; border-radius: 20px; padding: 10px; background: linear-gradient(180deg, rgba(8,12,38,.82), rgba(5,8,26,.9)); border: 2px solid rgba(160,190,255,.35);
    box-shadow: 0 0 0 6px rgba(120,150,255,.10), 0 0 90px rgba(120,100,255,.55), inset 0 0 60px rgba(60,80,200,.25); }
  #board { position: absolute; left: 10px; top: 12px; }
  .side { position: absolute; top: 62px; width: 380px; }
  .side .panel { position: relative; width: 380px; margin-bottom: 24px; }
  canvas.mini { display:block; margin-top: 8px; }
</style></head>
<body>
<div id="stage">
  <div class="glowA"></div><div class="glowB"></div>
  <div class="side" style="left:270px">
    <div class="panel"><h4>Hold</h4><canvas class="mini" id="hold" width="320" height="130"></canvas></div>
    <div class="panel"><h4>Level</h4><div class="big" id="level">1</div><div class="row2"><span>Lines</span><b id="lines">0</b></div><div class="row2"><span>Speed</span><b id="speed">1.0x</b></div></div>
    <div class="panel"><h4>Best</h4><div class="big" style="font-size:46px" id="best">0</div><div class="row2"><span>Games played</span><b id="plays">0</b></div></div>
  </div>
  <div class="well"><canvas id="board" width="460" height="920"></canvas></div>
  <div class="side" style="left:1270px">
    <div class="panel"><h4>Score</h4><div class="big" id="score">0</div><div class="row2"><span id="scoreNote">&nbsp;</span><b id="gain" style="color:#8dffb1"></b></div></div>
    <div class="panel"><h4>Next</h4><canvas class="mini" id="next" width="320" height="330"></canvas></div>
    <div class="panel"><h4>Time</h4><div class="big" style="font-size:46px" id="time">0:00</div></div>
  </div>
  <div class="bar"><div><span><span class="key">&larr; &rarr;</span>Move</span><span><span class="key">&uarr;</span>Rotate</span><span><span class="key">Z</span>Rotate back</span><span><span class="key">&darr;</span>Soft drop</span><span><span class="key">Space</span>Hard drop</span><span><span class="key">C</span>Hold</span></div><div><span style="margin:0"><span class="key">Esc</span>Menu</span></div></div>
  <div class="vig"></div>
  <div class="ov" id="ov"><div class="box"></div></div>
</div>
<script src="/bridge.js"></script><script src="/games/common/common.js"></script>
<script>
(function () {
  var COLS = 10, ROWS = 20, CW = 46;
  var COL = { I: ['#7ff6ff', '#1c8bd8'], O: ['#ffec80', '#ff9a1f'], T: ['#ff8ced', '#a02ad6'], S: ['#9bffa6', '#1fb86a'], Z: ['#ff9a8a', '#d6342f'], J: ['#8db6ff', '#2f58d6'], L: ['#ffc27a', '#e0661f'] };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]], O: [[1,0],[2,0],[1,1],[2,1]], T: [[1,0],[0,1],[1,1],[2,1]], S: [[1,0],[2,0],[0,1],[1,1]], Z: [[0,0],[1,0],[1,1],[2,1]], J: [[0,0],[0,1],[1,1],[2,1]], L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var SIZE = { I: 4, O: 4, T: 3, S: 3, Z: 3, J: 3, L: 3 };
  var board = document.getElementById('board'), bc = board.getContext('2d'), hold = document.getElementById('hold').getContext('2d'), next = document.getElementById('next').getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var grid, cur, queue, held, canHold, score, lines, level, gameOver, started, paused, dropT, lockT, lockResets, elapsed, last, bestSaved = 0, plays = 0, gainT = 0, totalCleared = 0;
  var keys = {}, rep = {}, sfx = window.Sfx;

  function rotCells(type, rot) {
    var n = SIZE[type], cells = SHAPES[type].map(function (c) { return [c[0], c[1]]; });
    if (type === 'O') return cells;
    for (var r = 0; r < rot; r++) cells = cells.map(function (c) { return [n - 1 - c[1], c[0]]; });
    return cells;
  }
  function bag() { var a = ['I', 'O', 'T', 'S', 'Z', 'J', 'L']; for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pull() { if (queue.length < 8) queue = queue.concat(bag()); return queue.shift(); }
  function spawn(type) {
    cur = { type: type, rot: 0, x: type === 'I' || type === 'O' ? 3 : 3, y: type === 'I' ? -1 : 0 };
    if (collide(cur.type, cur.rot, cur.x, cur.y)) { cur.y--; if (collide(cur.type, cur.rot, cur.x, cur.y)) end(); }
    dropT = 0; lockT = 0; lockResets = 0; canHold = true;
  }
  function collide(type, rot, x, y) {
    var cs = rotCells(type, rot);
    for (var i = 0; i < 4; i++) { var cx = x + cs[i][0], cy = y + cs[i][1]; if (cx < 0 || cx >= COLS || cy >= ROWS) return true; if (cy >= 0 && grid[cy][cx]) return true; }
    return false;
  }
  function reset() {
    grid = []; for (var r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(null));
    queue = bag().concat(bag()); held = null; score = 0; lines = 0; level = 1; gameOver = false; elapsed = 0; gainT = 0; totalCleared = 0; paused = false;
    spawn(pull()); ui();
  }
  function gravity() { var t = [0.8, 0.72, 0.63, 0.55, 0.47, 0.38, 0.3, 0.22, 0.13, 0.1, 0.083, 0.083, 0.083, 0.067, 0.067, 0.067, 0.05, 0.05, 0.05, 0.033]; return t[Math.min(level, 20) - 1] || 0.03; }
  function tryMove(dx, dy) { if (!collide(cur.type, cur.rot, cur.x + dx, cur.y + dy)) { cur.x += dx; cur.y += dy; if (dx) { sfx.move(); resetLock(); } return true; } return false; }
  function resetLock() { if (onGround() && lockResets < 15) { lockT = 0; lockResets++; } }
  function onGround() { return collide(cur.type, cur.rot, cur.x, cur.y + 1); }
  function rotate(d) {
    var nr = (cur.rot + d + 4) % 4, kicks = [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0], [-1, -1], [1, -1]];
    for (var i = 0; i < kicks.length; i++) { if (!collide(cur.type, nr, cur.x + kicks[i][0], cur.y + kicks[i][1])) { cur.rot = nr; cur.x += kicks[i][0]; cur.y += kicks[i][1]; sfx.rotate(); resetLock(); return; } }
  }
  function ghostY() { var y = cur.y; while (!collide(cur.type, cur.rot, cur.x, y + 1)) y++; return y; }
  function hardDrop() { var y = ghostY(), d = y - cur.y; cur.y = y; score += d * 2; sfx.drop(); lock(); }
  function doHold() {
    if (!canHold) return; var t = cur.type; if (held) { spawn(held); } else { spawn(pull()); } held = t; canHold = false; sfx.blip(440);
  }
  function lock() {
    var cs = rotCells(cur.type, cur.rot), over = false;
    cs.forEach(function (c) { var x = cur.x + c[0], y = cur.y + c[1]; if (y < 0) over = true; else grid[y][x] = cur.type; });
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) { if (grid[r].every(function (v) { return v; })) { grid.splice(r, 1); grid.unshift(new Array(COLS).fill(null)); cleared++; r++; } }
    if (cleared) {
      var pts = [0, 100, 300, 500, 800][cleared] * level; score += pts; lines += cleared; totalCleared += cleared; gainT = 1.6; $('gain').textContent = '+' + Game.fmt(pts);
      sfx.clear(cleared); GameStation.stat('lines', cleared); if (cleared === 4) GameStation.trophy('tetris');
      var nl = Math.floor(lines / 10) + 1; if (nl > level) { level = nl; GameStation.score(0, { levelmax: level }); sfx.win(); }
    }
    if (over) { end(); return; }
    spawn(pull());
  }
  function end() {
    gameOver = true; sfx.over();
    var wasBest = score > bestSaved;
    GameStation.score(score, { levelmax: level });
    var html = '<h1>Game over</h1>' + (wasBest && score > 0 ? '<div class="new">NEW BEST</div>' : '') + '<div class="stat"><div>Score<b>' + Game.fmt(score) + '</b></div><div>Lines<b>' + lines + '</b></div><div>Level<b>' + level + '</b></div></div><div class="go">Play again <span class="key" style="margin:0 0 0 8px;color:#fff">Enter</span></div>';
    if (wasBest) bestSaved = score; plays++; $('plays').textContent = plays;
    Game.overlay('ov', html, true); ui();
  }

  /* ---------- drawing ---------- */
  function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  function block(c, x, y, s, type, ghost, alpha) {
    var p = COL[type]; c.save(); c.globalAlpha = alpha == null ? 1 : alpha;
    if (ghost) { c.strokeStyle = p[0]; c.globalAlpha = .45; c.lineWidth = 2; c.setLineDash([6, 5]); rr(c, x + 3, y + 3, s - 6, s - 6, 8); c.stroke(); c.restore(); return; }
    c.shadowColor = p[1]; c.shadowBlur = 14;
    var g = c.createLinearGradient(x, y, x + s, y + s); g.addColorStop(0, p[0]); g.addColorStop(1, p[1]); c.fillStyle = g; rr(c, x + 2, y + 2, s - 4, s - 4, 8); c.fill();
    c.shadowBlur = 0; var h = c.createLinearGradient(0, y, 0, y + s * .6); h.addColorStop(0, 'rgba(255,255,255,.55)'); h.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = h; rr(c, x + 5, y + 5, s - 10, s * .45, 6); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 1.5; rr(c, x + 2, y + 2, s - 4, s - 4, 8); c.stroke(); c.restore();
  }
  function miniPiece(c, type, cx, cy, s) {
    var cs = SHAPES[type], minx = 9, maxx = -1, miny = 9, maxy = -1; cs.forEach(function (p) { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
    var w = (maxx - minx + 1) * s, h = (maxy - miny + 1) * s, ox = cx - w / 2, oy = cy - h / 2;
    cs.forEach(function (p) { block(c, ox + (p[0] - minx) * s, oy + (p[1] - miny) * s, s, type, false); });
  }
  function draw() {
    bc.clearRect(0, 0, 460, 920);
    bc.strokeStyle = 'rgba(150,170,255,.10)'; bc.lineWidth = 1; for (var i = 0; i <= COLS; i++) { bc.beginPath(); bc.moveTo(i * CW, 0); bc.lineTo(i * CW, 920); bc.stroke(); } for (var j = 0; j <= ROWS; j++) { bc.beginPath(); bc.moveTo(0, j * CW); bc.lineTo(460, j * CW); bc.stroke(); }
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) if (grid[r][c]) block(bc, c * CW, r * CW, CW, grid[r][c], false);
    if (cur && !gameOver) {
      var gy = ghostY(), cs = rotCells(cur.type, cur.rot);
      cs.forEach(function (p) { block(bc, (cur.x + p[0]) * CW, (gy + p[1]) * CW, CW, cur.type, true); });
      cs.forEach(function (p) { if (cur.y + p[1] >= 0) block(bc, (cur.x + p[0]) * CW, (cur.y + p[1]) * CW, CW, cur.type, false); });
    }
    hold.clearRect(0, 0, 320, 130); if (held) miniPiece(hold, held, 160, 65, 36, !canHold);
    next.clearRect(0, 0, 320, 330); for (var k = 0; k < 3; k++) miniPiece(next, queue[k], 160, 50 + k * 110, k === 0 ? 38 : 30);
  }
  function ui() {
    $('score').textContent = Game.fmt(score); $('lines').textContent = lines; $('level').textContent = level; $('speed').textContent = (0.8 / gravity()).toFixed(1) + 'x';
    var m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60); $('time').textContent = m + ':' + (s < 10 ? '0' : '') + s; $('best').textContent = Game.fmt(Math.max(bestSaved, score));
    $('gain').style.opacity = gainT > 0 ? 1 : 0;
  }

  /* ---------- loop + input ---------- */
  function press(code) {
    if (!started || gameOver) { if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { started = true; Sfx.unlock(); Game.overlay('ov', null, false); reset(); } return; }
    if (paused) return;
    switch (code) {
      case 'ArrowLeft': case 'KeyA': tryMove(-1, 0); rep.l = 0.16; break;
      case 'ArrowRight': case 'KeyD': tryMove(1, 0); rep.r = 0.16; break;
      case 'ArrowDown': case 'KeyS': if (tryMove(0, 1)) score++; rep.d = 0.04; break;
      case 'ArrowUp': case 'KeyX': rotate(1); break;
      case 'KeyZ': rotate(-1); break;
      case 'Space': hardDrop(); break;
      case 'KeyC': case 'ShiftLeft': doHold(); break;
    }
  }
  addEventListener('keydown', function (e) { if (e.repeat) { e.preventDefault(); return; } keys[e.code] = true; press(e.code); if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault(); });
  addEventListener('keyup', function (e) { keys[e.code] = false; });
  GameStation.onPause(function () { paused = true; }); GameStation.onResume(function () { paused = false; last = 0; });

  function frame(now) {
    var dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0; last = now;
    if (started && !gameOver && !paused) {
      elapsed += dt; if (gainT > 0) gainT -= dt;
      var L = keys.ArrowLeft || keys.KeyA, R = keys.ArrowRight || keys.KeyD, D = keys.ArrowDown || keys.KeyS;
      if (L && !R) { rep.l -= dt; if (rep.l <= 0) { tryMove(-1, 0); rep.l = 0.045; } }
      if (R && !L) { rep.r -= dt; if (rep.r <= 0) { tryMove(1, 0); rep.r = 0.045; } }
      if (D) { rep.d -= dt; if (rep.d <= 0) { if (tryMove(0, 1)) score++; rep.d = 0.035; dropT = 0; } }
      dropT += dt;
      if (onGround()) { lockT += dt; if (lockT >= 0.5) lock(); }
      else { lockT = 0; if (dropT >= gravity()) { dropT = 0; tryMove(0, 1); } }
      ui();
    }
    if (grid) draw();
    requestAnimationFrame(frame);
  }
  last = 0; grid = []; for (var r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(null)); queue = bag().concat(bag()); held = null; draw();
  GameStation.load().then(function (s) { var g = (s.games || {}).blockdrop || {}; bestSaved = g.best || 0; plays = g.plays || 0; $('best').textContent = Game.fmt(bestSaved); $('plays').textContent = plays; });
  Game.overlay('ov', '<h1>Block Drop</h1><p>Stack the falling blocks and clear lines.<br>Clear four at once for a trophy.</p><div class="go">Start <span class="key" style="margin:0 0 0 8px;color:#fff">Enter</span></div>', true);
  requestAnimationFrame(frame);
  if (location.hash === '#demo') { // screenshots / tests: starts by itself and plays at random
    setTimeout(function () { press('Enter'); var n = 0; var t = setInterval(function () { if (gameOver) { clearInterval(t); return; } n++; var m = Math.floor(Math.random() * 3); for (var i = 0; i < m; i++) rotate(1); tryMove(Math.floor(Math.random() * 7) - 3, 0); tryMove(Math.floor(Math.random() * 5) - 2, 0); if (n > 9) { clearInterval(t); return; } hardDrop(); }, 120); }, 200);
  }
})();
</script></body></html>
