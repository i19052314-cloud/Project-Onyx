<html lang="en"><head><meta charset="utf-8"><title>Dominoes</title>
<link rel="stylesheet" href="/games/common/common.css">
<style>
  #stage { background: #03190d; }
  canvas { position:absolute; left:0; top:0; }
  .hud { position:absolute; left: 96px; top: 40px; z-index:3; display:flex; gap: 22px; }
  .hud .s { min-width: 250px; border-radius: 18px; padding: 14px 26px; background: linear-gradient(180deg, rgba(8,50,28,.7), rgba(3,24,13,.78)); border: 1.5px solid rgba(160,255,200,.22); backdrop-filter: blur(8px); }
  .hud h4 { font-size: 16px; letter-spacing: 4px; color: #8fdcae; text-transform: uppercase; font-weight: 600; }
  .hud .v { font-family: 'Bahnschrift','Segoe UI'; font-size: 48px; font-weight: 800; margin-top: 2px; }
  .status { position:absolute; left:0; right:0; top: 610px; text-align:center; z-index:3; font-size: 34px; font-weight:600; text-shadow: 0 3px 16px rgba(0,0,0,.7); }
  .status small { display:block; font-size: 22px; color: #bfe9cf; font-weight: 400; margin-top: 4px; }
</style></head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="hud"><div class="s"><h4>Your tiles</h4><div class="v" id="mine">7</div></div><div class="s"><h4>Mookie</h4><div class="v" id="his">7</div></div><div class="s"><h4>Boneyard</h4><div class="v" id="yard">14</div></div></div>
  <div class="status" id="status"></div>
  <div class="bar"><div><span><span class="key">&larr; &rarr;</span>Pick a tile</span><span><span class="key">Enter</span>Play / Draw</span><span><span class="key">P</span>Pass (when stuck)</span></div><div><span style="margin:0"><span class="key">Esc</span>Menu</span></div></div>
  <div class="vig"></div>
  <div class="ov" id="ov"><div class="box"></div></div>
</div>
<script src="/bridge.js"></script><script src="/games/common/common.js"></script>
<script>
(function () {
  var W = 1920, H = 1080, c = document.getElementById('c').getContext('2d'), $ = function (i) { return document.getElementById(i); };
  var state = 'title', paused = false, last = 0, hand, cpu, yard, chain, turn, sel = 0, side = 'r', passes = 0, bestSaved = 0, anim = [], msg = '', sub = '', t = 0, timers = [];

  function later(ms, fn) { setTimeout(function () { (function go() { if (paused) setTimeout(go, 300); else fn(); })(); }, ms); }
  function deal() {
    var all = []; for (var a = 0; a <= 6; a++) for (var b = a; b <= 6; b++) all.push([a, b]);
    for (var i = all.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var tmp = all[i]; all[i] = all[j]; all[j] = tmp; }
    hand = all.splice(0, 7); cpu = all.splice(0, 7); yard = all; chain = []; passes = 0; sel = 0; anim = [];
    // the one with the highest double starts (or the highest tile)
    var best = function (h) { var d = -1, tile = null; h.forEach(function (x) { if (x[0] === x[1] && x[0] > d) { d = x[0]; tile = x; } }); if (tile) return { v: 100 + d, t: tile }; var m = -1; h.forEach(function (x) { if (x[0] + x[1] > m) { m = x[0] + x[1]; tile = x; } }); return { v: m, t: tile }; };
    var me = best(hand), him = best(cpu);
    if (me.v >= him.v) { place(hand, me.t, 'r', 'you'); turn = 'cpu'; setMsg('You lead the ' + me.t[0] + '-' + me.t[1], 'Mookie plays next'); }
    else { place(cpu, him.t, 'r', 'cpu'); turn = 'you'; setMsg('Mookie leads the ' + him.t[0] + '-' + him.t[1], 'Your move'); }
    sortHand(); ui(); if (turn === 'cpu') later(1300, cpuTurn);
  }
  function sortHand() { hand.sort(function (a, b) { return (b[0] + b[1]) - (a[0] + a[1]); }); sel = Math.min(sel, hand.length - 1); }
  function ends() { return chain.length ? { l: chain[0].l, r: chain[chain.length - 1].r } : null; }
  function fits(tile, e) { return !e || tile[0] === e.l || tile[1] === e.l || tile[0] === e.r || tile[1] === e.r; }
  function sidesFor(tile) { var e = ends(); if (!e) return ['r']; var s = []; if (tile[0] === e.l || tile[1] === e.l) s.push('l'); if (tile[0] === e.r || tile[1] === e.r) s.push('r'); return s; }
  function place(from, tile, sd, who) {
    var idx = from.indexOf(tile); from.splice(idx, 1); var e = ends(), x = tile[0], y = tile[1], el;
    if (!e) el = { l: x, r: y, who: who, t: 0 };
    else if (sd === 'l') el = (x === e.l) ? { l: y, r: x } : { l: x, r: y }; else el = (x === e.r) ? { l: x, r: y } : { l: y, r: x };
    el.who = who; el.t = 0; el.fromY = who === 'you' ? 900 : 120;
    if (sd === 'l' && e) chain.unshift(el); else chain.push(el); passes = 0; Sfx.tone(180, .08, 'square', .2, .6); Sfx.noise(.05, .12);
    if (who === 'you' && tile[0] === 6 && tile[1] === 6) GameStation.trophy('double6');
  }
  function setMsg(a, b) { msg = a; sub = b || ''; $('status').innerHTML = a + (b ? '<small>' + b + '</small>' : ''); }
  function ui() { $('mine').textContent = hand.length; $('his').textContent = cpu.length; $('yard').textContent = yard.length; }
  function playable(h) { var e = ends(); return h.filter(function (x) { return fits(x, e); }); }

  function endRound(reason) {
    state = 'over'; var mine = hand.reduce(function (a, x) { return a + x[0] + x[1]; }, 0), his = cpu.reduce(function (a, x) { return a + x[0] + x[1]; }, 0), win;
    if (hand.length === 0) win = true; else if (cpu.length === 0) win = false; else win = mine < his ? true : mine > his ? false : null;
    var pts = win ? (hand.length === 0 ? his : his - mine) : 0, wasBest = pts > bestSaved;
    if (win) { Sfx.win(); GameStation.stat('wins', 1); if (pts > 0) { GameStation.score(pts); if (wasBest) bestSaved = pts; } } else Sfx.over();
    later(900, function () { Game.overlay('ov', '<h1>' + (win === null ? 'Draw' : win ? 'You win' : 'Mookie wins') + '</h1>' + (win && wasBest && pts > 0 ? '<div class="new">NEW BEST</div>' : '') + '<p>' + reason + '</p><div class="stat"><div>Your pips<b>' + mine + '</b></div><div>Mookie\'s pips<b>' + his + '</b></div>' + (win ? '<div>Points<b>+' + pts + '</b></div>' : '') + '</div><div class="go">Deal again <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true); });
  }
  function checkEnd() {
    if (hand.length === 0) { endRound('You played your last tile.'); return true; }
    if (cpu.length === 0) { endRound('Mookie played the last tile.'); return true; }
    if (passes >= 2 && yard.length === 0) { endRound('The table is blocked.'); return true; }
    return false;
  }
  function cpuTurn() {
    if (state !== 'play') return; var e = ends(), opts = playable(cpu);
    while (!opts.length && yard.length) { cpu.push(yard.pop()); opts = playable(cpu); setMsg('Mookie draws', yard.length + ' left in the boneyard'); ui(); Sfx.blip(300); }
    if (!opts.length) { passes++; setMsg('Mookie passes', 'Your move'); turn = 'you'; ui(); if (checkEnd()) return; autoPassCheck(); return; }
    opts.sort(function (a, b) { return (b[0] + b[1]) - (a[0] + a[1]); }); var tile = opts[0], ss = sidesFor(tile), sd = ss[Math.floor(Math.random() * ss.length)];
    place(cpu, tile, sd, 'cpu'); ui(); setMsg('Mookie plays ' + tile[0] + '-' + tile[1], 'Your move'); turn = 'you'; if (checkEnd()) return; autoPassCheck();
  }
  function autoPassCheck() { if (!playable(hand).length && !yard.length) { setMsg('No move for you', 'Press P to pass'); } else if (!playable(hand).length) setMsg(msg, 'No tile fits: press Enter to draw'); }
  function playerPlay(sd) {
    var tile = hand[sel]; place(hand, tile, sd, 'you'); sortHand(); ui(); state = 'play'; turn = 'cpu'; setMsg('You play ' + tile[0] + '-' + tile[1], 'Mookie is thinking'); if (checkEnd()) return; later(1000, cpuTurn);
  }
  function enter() {
    if (turn !== 'you' || state === 'over') return;
    if (state === 'side') { playerPlay(side); return; }
    var e = ends(), tile = hand[sel];
    if (!playable(hand).length) { if (yard.length) { hand.push(yard.pop()); sortHand(); ui(); Sfx.blip(300); autoPassCheck(); } return; }
    if (!fits(tile, e)) { Sfx.blip(130); return; }
    var ss = sidesFor(tile); if (ss.length === 2 && !(chain.length && chain[0].l === chain[chain.length - 1].r && ends().l === ends().r && false)) { state = 'side'; side = ss[0]; setMsg('Which end?', 'Left / Right to pick, Enter to play'); return; }
    playerPlay(ss[0]);
  }
  function press(code) {
    if (state === 'title' || state === 'over') { if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { Sfx.unlock(); Game.overlay('ov', null, false); state = 'play'; deal(); } return; }
    if (paused) return;
    if (state === 'side') { if (code === 'ArrowLeft' || code === 'KeyA') side = 'l'; else if (code === 'ArrowRight' || code === 'KeyD') side = 'r'; else if (code === 'Enter' || code === 'Space') enter(); else if (code === 'Backspace') { state = 'play'; setMsg('Your move', ''); } return; }
    if (turn !== 'you') return;
    switch (code) {
      case 'ArrowLeft': case 'KeyA': sel = (sel + hand.length - 1) % hand.length; Sfx.blip(380); break;
      case 'ArrowRight': case 'KeyD': sel = (sel + 1) % hand.length; Sfx.blip(380); break;
      case 'Enter': case 'Space': enter(); break;
      case 'KeyP': if (!playable(hand).length && !yard.length) { passes++; turn = 'cpu'; setMsg('You pass', 'Mookie is thinking'); if (!checkEnd()) later(900, cpuTurn); } break;
    }
  }
  addEventListener('keydown', function (e) { if (!e.repeat || e.code.indexOf('Arrow') === 0) press(e.code); if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault(); });
  GameStation.onPause(function () { paused = true; }); GameStation.onResume(function () { paused = false; last = 0; });

  /* ---------- drawing ---------- */
  var PIPS = { 0: [], 1: [[1, 1]], 2: [[0, 0], [2, 2]], 3: [[0, 0], [1, 1], [2, 2]], 4: [[0, 0], [2, 0], [0, 2], [2, 2]], 5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]], 6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]] };
  function rr(x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  // a tile centred at (x,y), length L (long side) on the x axis before rotating by rot; a = first half, b = second half
  function tile(x, y, L, a, b, rot, opts) {
    opts = opts || {}; var Wd = L / 2, s = L / 2; c.save(); c.translate(x, y); c.rotate(rot); if (opts.scale) c.scale(opts.scale, opts.scale);
    c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 16; c.shadowOffsetY = 8;
    if (opts.back) { var gb = c.createLinearGradient(-L / 2, -Wd / 2, L / 2, Wd / 2); gb.addColorStop(0, '#1f3a2c'); gb.addColorStop(1, '#0f2218'); c.fillStyle = gb; rr(-L / 2, -Wd / 2, L, Wd, L * .1); c.fill(); c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2; c.stroke(); c.restore(); return; }
    var g = c.createLinearGradient(0, -Wd / 2, 0, Wd / 2); g.addColorStop(0, opts.dim ? '#bdb9a3' : '#fbf7ea'); g.addColorStop(1, opts.dim ? '#8f8b78' : '#d8d1b8'); c.fillStyle = g; rr(-L / 2, -Wd / 2, L, Wd, L * .1); c.fill(); c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.strokeStyle = 'rgba(70,64,40,.55)'; c.lineWidth = 2.5; c.stroke(); c.beginPath(); c.moveTo(0, -Wd / 2 + 8); c.lineTo(0, Wd / 2 - 8); c.strokeStyle = 'rgba(80,72,50,.8)'; c.lineWidth = 3; c.stroke();
    [[-1, a], [1, b]].forEach(function (h) { var cx = h[0] * L / 4, step = Wd * .27; c.fillStyle = opts.dim ? '#3a3a3a' : '#16181d'; PIPS[h[1]].forEach(function (p) { c.beginPath(); c.arc(cx + (p[1] - 1) * step, (p[0] - 1) * step, Wd * .085, 0, 6.3); c.fill(); }); });
    if (opts.glow) { c.strokeStyle = opts.glow; c.lineWidth = 6; c.shadowColor = opts.glow; c.shadowBlur = 24; rr(-L / 2, -Wd / 2, L, Wd, L * .1); c.stroke(); }
    c.restore();
  }
  function drawChain() {
    if (!chain.length) return; var gap = 4, totalW = 0; chain.forEach(function (el) { totalW += (el.l === el.r ? 60 : 120) + gap; });
    var sc = Math.min(1, 1620 / totalW), x = W / 2 - totalW * sc / 2, y = H / 2 - 20;
    chain.forEach(function (el) {
      var w = (el.l === el.r ? 60 : 120), cx = x + w * sc / 2; el.t = Math.min(1, el.t + .06); var e = 1 - Math.pow(1 - el.t, 3), yy = y + ((el.fromY || y) - y) * (1 - e) * .6;
      if (el.l === el.r) tile(cx, yy, 120, el.l, el.r, Math.PI / 2, { scale: sc }); else tile(cx, yy, 120, el.l, el.r, 0, { scale: sc }); x += (w + gap) * sc;
    });
  }
  function draw() {
    var g = c.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 1150); g.addColorStop(0, '#2a9a5c'); g.addColorStop(.55, '#0c4a28'); g.addColorStop(1, '#03190d'); c.fillStyle = g; c.fillRect(0, 0, W, H);
    c.save(); c.globalAlpha = .05; c.fillStyle = '#fff'; for (var i = 0; i < 500; i++) c.fillRect((i * 131) % W, (i * 71) % H, 2, 2); c.restore();
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 3; c.beginPath(); c.ellipse(W / 2, H / 2, 880, 430, 0, 0, 6.3); c.stroke();
    if (!hand) return; drawChain();
    // Mookie's tiles (backs)
    var n = cpu.length, x0 = W / 2 - (n - 1) * 36; for (var k = 0; k < n; k++) tile(x0 + k * 72, 200, 130, 0, 0, Math.PI / 2, { back: true });
    // boneyard
    var ny = Math.min(8, yard.length); for (var m = 0; m < ny; m++) tile(1640 + m * 3, 560 - m * 3, 110, 0, 0, Math.PI / 2 + (m % 3 - 1) * .04, { back: true });
    c.fillStyle = 'rgba(255,255,255,.55)'; c.font = '600 24px Segoe UI'; c.textAlign = 'center'; c.fillText('BONEYARD ' + yard.length, 1650, 650);
    // your hand
    var hn = hand.length, sp = Math.min(120, 1500 / Math.max(1, hn)), hx = W / 2 - (hn - 1) * sp / 2, e = ends(), can = playable(hand), mine = turn === 'you' && state !== 'over';
    for (var q = 0; q < hn; q++) { var t0 = hand[q], ok = fits(t0, e), up = q === sel && mine ? -34 : 0; tile(hx + q * sp, 880 + up, 170, t0[0], t0[1], Math.PI / 2, { dim: mine && can.length && !ok, glow: q === sel && mine ? '#7fe0ff' : null }); }
    if (state === 'side' && e) { var tt = hand[sel]; c.font = '700 30px Segoe UI'; c.fillStyle = side === 'l' ? '#7fe0ff' : 'rgba(255,255,255,.4)'; c.textAlign = 'right'; c.fillText('◀ LEFT END ' + e.l, W / 2 - 30, 722); c.fillStyle = side === 'r' ? '#7fe0ff' : 'rgba(255,255,255,.4)'; c.textAlign = 'left'; c.fillText('RIGHT END ' + e.r + ' ▶', W / 2 + 30, 722); }
  }
  function frame(now) { last = now; draw(); requestAnimationFrame(frame); }
  GameStation.load().then(function (s) { var g = (s.games || {}).dominoes || {}; bestSaved = g.best || 0; });
  Game.overlay('ov', '<h1>Dominoes</h1><p>Match the ends of the chain. If nothing fits, draw from the boneyard.<br>First to play every tile wins the round.</p><div class="go">Deal <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true);
  hand = []; cpu = []; yard = []; chain = []; requestAnimationFrame(frame);
  window.__dbg = function () { return JSON.stringify({ state: state, turn: turn, hand: hand, chain: chain.length, cpu: cpu.length }); };
  if (location.hash === '#demo') setTimeout(function () { press('Enter'); var n = 0; setInterval(function () { if (state === 'play' || state === 'side') { n++; if (n < 7) { if (state === 'side') press('Enter'); else { sel = Math.floor(Math.random() * hand.length); enter(); } } } }, 900); }, 200);
})();
</script></body></html>
