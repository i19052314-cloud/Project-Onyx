<html lang="en"><head><meta charset="utf-8"><title>PokeRogue</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  html, body { width:100%; height:100%; background:#0a142a; color:#ffe14a; font-family:'Segoe UI Variable Display','Segoe UI',Arial,sans-serif; display:flex; align-items:center; justify-content:center; text-align:center }
  h1 { font-size:46px; letter-spacing:6px; text-transform:uppercase } p { margin-top:14px; font-size:20px; color:#c8d0e0 }
  #back { display:none; margin-top:28px; padding:12px 30px; border-radius:26px; background:#fff; color:#0a1228; font-weight:700; cursor:pointer }
</style></head>
<body><div><h1>POKEROGUE</h1><p id="p">Loading the game. Press F9 to come back to the console.</p><span id="back">Back to the console</span></div>
<script src="/bridge.js"></script>
<script>
(function () {
  var URL = 'https://pokerogue.net/';
  document.getElementById('back').onclick = function () { GameStation.quit(); };
  if (navigator.onLine === false) { document.getElementById('p').textContent = 'This game loads from the internet. Check your connection and open it again.'; document.getElementById('back').style.display = 'inline-block'; return; }
  // the game needs a top-level page (shared memory needs cross-origin isolation): the window of the console goes to the site, F9 comes back
  GameStation.stat('launches', 1).then(function () {}, function () {}).then(function () {
    setTimeout(function () {
      if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage('go:' + URL); else location.href = URL;
    }, 1800);
  });
})();
</script></body></html>
