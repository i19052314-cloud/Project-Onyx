<html lang="en"><head><meta charset="utf-8"><title>Paddle</title>
<link rel="stylesheet" href="/games/common/common.css">
<style>
  #stage { background: radial-gradient(ellipse at 50% 40%, #2748c9 0%, #101c66 42%, #040824 85%); }
  .court { position:absolute; left: 210px; top: 84px; width: 1500px; height: 880px; border-radius: 18px; overflow:hidden; border: 2px solid rgba(140,170,255,.45); background: linear-gradient(180deg, rgba(6,12,50,.88), rgba(3,6,28,.92)); box-shadow: 0 0 0 6px rgba(100,130,255,.10), 0 0 90px rgba(90,120,255,.45), inset 0 0 70px rgba(40,70,200,.25); }
  canvas { display:block; }
  .names { position:absolute; left: 210px; width: 1500px; top: 28px; display:flex; justify-content: space-between; font-size: 26px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; padding: 0 12px; }
  .names .a { color: #6fe0ff; } .names .b { color: #ff7ab0; } .names .m { color: #9fb0d6; font-weight: 500; letter-spacing: 2px; }
</style></head>
<body>
<div id="stage">
  <div class="names"><span class="a" id="nameA">You</span><span class="m" id="rallyTxt">First to 7</span><span class="b">Mookie (CPU)</span></div>
  <div class="court"><canvas id="c" width="1500" height="880"></canvas></div>
  <div class="bar"><div><span><span class="key">&uarr; &darr;</span>Move</span><span><span class="key">W S</span>Move</span><span><span class="key">Space</span>Serve now</span></div><div><span style="margin:0"><span class="key">Esc</span>Menu</span></div></div>
  <div class="vig"></div>
  <div class="ov" id="ov"><div class="box"></div></div>
</div>
<script src="/bridge.js"></script><script src="/games/common/common.js"></script>
<script>
(function () {
  var W = 1500, H = 880, PW = 26, PH = 170, M = 46, WIN = 7;
  var c = document.getElementById('c').getContext('2d'), $ = function (i) { return document.getElementById(i); };
  var state = 'title', paused = false, last, keys = {}, py, cy, ball, sa, sb, rally, maxRally, serveT, serveDir, trail = [], flash = 0, bestSaved = 0, cpuErr = 0, shake = 0, countdown = 0, wins = 0;

  function newMatch() { sa = 0; sb = 0; rally = 0; maxRally = 0; py = H / 2; cy = H / 2; serve(Math.random() < .5 ? 1 : -1); state = 'play'; }
  function serve(dir) { ball = { x: W / 2, y: H / 2 + (Math.random() - .5) * 200, vx: 0, vy: 0, sp: 640 }; serveDir = dir; serveT = 1.1; rally = 0; trail = []; $('rallyTxt').textContent = 'First to ' + WIN; }
  function launch() { var a = (Math.random() - .5) * 0.7; ball.vx = Math.cos(a) * ball.sp * serveDir; ball.vy = Math.sin(a) * ball.sp; serveT = 0; Sfx.blip(520); }
  function hit(p, isPlayer) {
    var rel = (ball.y - p) / (PH / 2); rel = Math.max(-1, Math.min(1, rel)); var ang = rel * 1.0;
    ball.sp = Math.min(1500, ball.sp + 34); ball.vx = Math.cos(ang) * ball.sp * (isPlayer ? 1 : -1); ball.vy = Math.sin(ang) * ball.sp;
    rally++; if (rally > maxRally) maxRally = rally; flash = 1; shake = 6; Sfx.tone(isPlayer ? 440 : 330, .06, 'square', .2); $('rallyTxt').textContent = rally > 2 ? 'Rally ' + rally : 'First to ' + WIN;
    cpuErr = (Math.random() - .5) * (130 - Math.min(80, rally * 6)); GameStation.score(0, { rally: rally });
  }
  function point(playerScored) {
    if (playerScored) sa++; else sb++; Sfx[playerScored ? 'coin' : 'hit'](); shake = 14;
    if (sa >= WIN || sb >= WIN) return finish(sa > sb);
    serve(playerScored ? -1 : 1);
  }
  function finish(won) {
    state = 'over'; var sc = sa * 100 + maxRally * 10 + (won ? 500 : 0), wasBest = sc > bestSaved; if (wasBest) bestSaved = sc;
    won ? Sfx.win() : Sfx.over(); GameStation.score(sc, { rally: maxRally });
    if (won) { GameStation.stat('wins', 1); if (sb === 0) GameStation.trophy('shutout'); }
    Game.overlay('ov', '<h1>' + (won ? 'You win' : 'You lose') + '</h1>' + (wasBest && sc > 0 ? '<div class="new">NEW BEST</div>' : '') + '<div class="stat"><div>Match<b>' + sa + ' - ' + sb + '</b></div><div>Longest rally<b>' + maxRally + '</b></div><div>Score<b>' + Game.fmt(sc) + '</b></div></div><div class="go">Rematch <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true);
  }
  function update(dt) {
    var up = keys.ArrowUp || keys.KeyW, dn = keys.ArrowDown || keys.KeyS;
    if (up && !dn) py -= 980 * dt; else if (dn && !up) py += 980 * dt; py = Math.max(PH / 2 + 8, Math.min(H - PH / 2 - 8, py));
    if (serveT > 0) { serveT -= dt; if (serveT <= 0) launch(); }
    else {
      // the CPU: follows the ball when it comes to him, drifts back to the middle otherwise
      var target = ball.vx > 0 ? ball.y + cpuErr : H / 2, diff = target - cy, spd = 520 + Math.min(300, maxRally * 12) + (sa - sb) * 28;
      if (ball.vx > 0 && ball.x < W * 0.28) spd *= .55;
      cy += Math.max(-spd * dt, Math.min(spd * dt, diff)); cy = Math.max(PH / 2 + 8, Math.min(H - PH / 2 - 8, cy));
      ball.x += ball.vx * dt; ball.y += ball.vy * dt; trail.push({ x: ball.x, y: ball.y }); if (trail.length > 16) trail.shift();
      if (ball.y < 16) { ball.y = 16; ball.vy = Math.abs(ball.vy); Sfx.blip(260); } if (ball.y > H - 16) { ball.y = H - 16; ball.vy = -Math.abs(ball.vy); Sfx.blip(260); }
      if (ball.vx < 0 && ball.x - 16 < M + PW && ball.x > M - 10 && Math.abs(ball.y - py) < PH / 2 + 14) { ball.x = M + PW + 16; hit(py, true); }
      if (ball.vx > 0 && ball.x + 16 > W - M - PW && ball.x < W - M + 10 && Math.abs(ball.y - cy) < PH / 2 + 14) { ball.x = W - M - PW - 16; hit(cy, false); }
      if (ball.x < -30) point(false); else if (ball.x > W + 30) point(true);
    }
    if (flash > 0) flash -= dt * 5; if (shake > 0) shake -= dt * 30;
  }
  function pad(x, y, col) {
    c.save(); c.shadowColor = col; c.shadowBlur = 30; var g = c.createLinearGradient(x, 0, x + PW, 0); g.addColorStop(0, col); g.addColorStop(1, '#fff'); c.fillStyle = g;
    c.beginPath(); c.roundRect ? c.roundRect(x, y - PH / 2, PW, PH, 13) : c.rect(x, y - PH / 2, PW, PH); c.fill(); c.restore();
  }
  function draw() {
    c.save(); if (shake > 0) c.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    c.clearRect(-20, -20, W + 40, H + 40);
    c.setLineDash([34, 30]); c.strokeStyle = 'rgba(130,160,255,.6)'; c.lineWidth = 6; c.beginPath(); c.moveTo(W / 2, 0); c.lineTo(W / 2, H); c.stroke(); c.setLineDash([]);
    c.font = '800 280px Bahnschrift, Segoe UI'; c.textAlign = 'center'; c.fillStyle = 'rgba(180,205,255,.13)'; c.fillText(sa == null ? '0' : sa, W / 2 - 250, 330); c.fillText(sb == null ? '0' : sb, W / 2 + 250, 330);
    if (state !== 'title' && py != null) {
      pad(M, py, '#6fe0ff'); pad(W - M - PW, cy, '#ff6fa8');
      trail.forEach(function (t, i) { c.globalAlpha = i / trail.length * .4; c.fillStyle = '#9ef'; c.beginPath(); c.arc(t.x, t.y, 6 + i * .9, 0, 6.3); c.fill(); }); c.globalAlpha = 1;
      var g = c.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, 60); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.3, 'rgba(150,230,255,.55)'); g.addColorStop(1, 'rgba(150,230,255,0)'); c.fillStyle = g; c.beginPath(); c.arc(ball.x, ball.y, 60, 0, 6.3); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ball.x, ball.y, 14, 0, 6.3); c.fill();
      if (serveT > 0) { c.fillStyle = 'rgba(255,255,255,.8)'; c.font = '700 44px Segoe UI'; c.fillText('GET READY', W / 2, H - 70); }
    }
    if (flash > 0) { c.fillStyle = 'rgba(160,200,255,' + flash * .07 + ')'; c.fillRect(0, 0, W, H); }
    c.restore();
  }
  function press(code) { if (state !== 'play') { if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { Sfx.unlock(); Game.overlay('ov', null, false); newMatch(); } return; } if (code === 'Space' && serveT > 0) serveT = 0.001; }
  addEventListener('keydown', function (e) { keys[e.code] = true; if (!e.repeat) press(e.code); if (e.code.indexOf('Arrow') === 0 || e.code === 'Space') e.preventDefault(); });
  addEventListener('keyup', function (e) { keys[e.code] = false; });
  GameStation.onPause(function () { paused = true; }); GameStation.onResume(function () { paused = false; last = 0; });
  function frame(now) { var dt = last ? Math.min(0.033, Math.max(0, (now - last) / 1000)) : 0; last = now; if (state === 'play' && !paused && !window.__sim) update(dt); draw(); requestAnimationFrame(frame); }
  last = 0; sa = 0; sb = 0;
  GameStation.load().then(function (s) { var g = (s.games || {}).paddle || {}; bestSaved = g.best || 0; });
  Game.overlay('ov', '<h1>Paddle</h1><p>First to 7 wins. Hit the ball with the edge of the paddle to curve it.<br>The longer the rally, the faster the ball.</p><div class="go">Start <span class="key" style="margin:0 0 0 8px">Enter</span></div>', true);
  window.__dbg = function () { return JSON.stringify({ state: state, serveT: serveT, ball: ball, py: py, cy: cy, sa: sa, sb: sb, paused: paused, rally: rally, last: last }); };
  requestAnimationFrame(frame);
  if (location.hash === '#demo') setTimeout(function () { window.__sim = true; setInterval(function () { for (var i = 0; i < 6; i++) if (state === 'play') update(0.016); }, 10); press('Enter'); setInterval(function () { if (state === 'play' && ball) { keys.ArrowUp = ball.y < py - 20; keys.ArrowDown = ball.y > py + 20; } }, 30); }, 200);
})();
</script></body></html>
