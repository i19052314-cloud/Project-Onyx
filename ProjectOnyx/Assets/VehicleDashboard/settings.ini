[General]
; Opening is owned by Onyx's configurable vehicle-controller binding (M by default).
DistanceUnit=Km
OnlyDriver=true
RequireEngineRunning=true
EnableControlWhileOpen=false

[Music]
DefaultVolume=20
MusicOutsideVehicle=true
OutsideMusicDistance=80
MaxDurationMinutes=90
SkipSeconds=10
YtDlpPath=
DefaultPlaylist=

[Apps]
MusicPlaylist=true
AiAssistant=true
MusicOverlay=true
VideoPlayer=false
CarControl=true
CarInfo=true
CarAutomation=true
Game=true
MusicNeonRgb=true

[Autopilot]
MaxSpeed=40
DriveStyle=786859

[ParkingSensor]
Enable=true
Distance=3
