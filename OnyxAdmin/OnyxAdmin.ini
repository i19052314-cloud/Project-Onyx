; ONYX ADMIN - runtime settings.
; Sits next to the DLL in <GTA>\scripts\. Restart the game (or reload scripts)
; after editing. Keys are System.Windows.Forms.Keys names.

[General]
; Master switch. false = the module loads nothing and does nothing.
Enabled=true
; Write OnyxAdmin\onyx-admin.log
Logging=true
; Log level: 0=error 1=warn 2=info 3=debug
LogLevel=2
; ru = Russian interface, anything else = English
Language=ru
; How often the tick loop runs, in milliseconds. Lower is snappier and costs
; frames; 60 is a good compromise.
TickIntervalMs=60
; Start with god mode already on. Off by default: an admin tool that silently
; makes you immortal is a bug, not a feature.
GodModeOnStartup=false

[Input]
; Open/close the admin panel.
; F5 is free: Onyx RP uses F9 (enable) and F10 (settings), OnyxNations uses F8,
; and ScriptHookVDotNet's console defaults to F4.
MenuKey=F5
; Inside the panel.
UpKey=Up
DownKey=Down
; Left/Right move through the weapon and vehicle pickers.
AdjustPrevKey=Left
AdjustNextKey=Right
; Apply the highlighted row, or flip a toggle.
ActivateKey=Enter
CloseKey=Back

; ---------------------------------------------------------------------------
; What this panel does NOT do, and why
; ---------------------------------------------------------------------------
; There is no money, inventory or job option here. Onyx RP owns its wallet, its
; items and its jobs; writing to them from outside would corrupt a save. This
; panel touches only what GTA itself exposes through ScriptHookVDotNet.
